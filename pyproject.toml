[tool.black]
line-length = 150

[project]
name = "monocular_demos"
version = "0.1.0"
description = "Biomechanical fitting from monocular video"
readme = "README.md"
authors = [
    {name = "J.D. Peiffer"}
]
requires-python = ">=3.11.0"
dependencies = [
    "torch>=2.2",
    "torchvision",
    "mujoco==3.9.0",
    "numpy",
    "tqdm",
    "gradio",
    "numpy-stl",
    "opencv-python",
    "plotly",
    "PyOpenGL>=3.1.4",
    "pyrender",
    "trimesh",
    "ultralytics>=8.3,<8.5",
    "hydra-core<1.4",
    "simplepyutils",
    "addict",
    "more-itertools",
    "einops",
]

[project.optional-dependencies]
reference = [
    "equinox==0.13.8",
    "jax==0.10.1",
    "jaxlie",
    "jmp",
    "mujoco-mjx==3.9.0",
    "optax",
]
notebooks = [
    "ipykernel",
    "matplotlib",
    "numpy",
]
dev = [
    "pytest",
]

[tool.uv]
override-dependencies = ["PyOpenGL==3.1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.setuptools.packages.find]
include = ["monocular_demos*"]

[tool.setuptools.package-data]
"*" = ["biomechanics_mjx/data/humanoid/**/*"]
